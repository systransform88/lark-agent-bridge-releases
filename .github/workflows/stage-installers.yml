name: Stage verified public installers
on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Temporary installer links, expected checksums and licence assets
        required: true
        type: string
permissions:
  contents: write
concurrency: public-installer-staging
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify and upload draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_MANIFEST: ${{ inputs.manifest }}
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),cp=require('node:child_process');
          const {Readable,Transform}=require('node:stream');const {pipeline}=require('node:stream/promises');
          const repo='systransform88/lark-agent-bridge-releases';
          async function main(){
            if(process.env.GITHUB_REPOSITORY!==repo||process.env.GITHUB_REF!=='refs/heads/main')throw Error('Unexpected repository or branch');
            const manifest=JSON.parse(process.env.INPUT_MANIFEST),tag='v0.2.0-alpha.7';
            const expected=['Lark-Agent-Bridge-0.2.0-alpha.7-win-x64.exe','Lark-Agent-Bridge-0.2.0-alpha.7-mac-arm64.dmg','Lark-Agent-Bridge-0.2.0-alpha.7-mac-arm64.zip','Lark-Agent-Bridge-0.2.0-alpha.7-linux-x86_64.AppImage','Lark-Agent-Bridge-0.2.0-alpha.7-linux-amd64.deb','LICENSE.txt','THIRD_PARTY_NOTICES.md','SHA256SUMS.txt'].sort();
            if(!Array.isArray(manifest)||JSON.stringify(manifest.map(a=>a.name).sort())!==JSON.stringify(expected))throw Error('Unexpected asset names');
            const release=JSON.parse(cp.execFileSync('gh',['release','view',tag,'--repo',repo,'--json','isDraft,isPrerelease,assets'],{encoding:'utf8'}));
            if(!release.isDraft||!release.isPrerelease)throw Error('Expected draft prerelease');
            for(const a of manifest){if(!/^[0-9a-f]{64}$/.test(a.sha256)||!Number.isSafeInteger(a.size)||a.size<1||a.size>500000000)throw Error('Invalid digest or size');if(a.url){const u=new URL(a.url);if(u.protocol!=='https:'||u.hostname!=='release-assets.githubusercontent.com'||u.username||u.password)throw Error('Unexpected download host');console.log('::add-mask::'+a.url);}else if(!a.data)throw Error('Missing content');}
            fs.mkdirSync('installers');
            await Promise.all(manifest.map(async a=>{
              const file='installers/'+a.name;
              if(a.url){const response=await fetch(a.url,{redirect:'error',signal:AbortSignal.timeout(600000)});if(!response.ok)throw Error('Download failed for '+a.name+' status '+response.status);let size=0;const hash=crypto.createHash('sha256');await pipeline(Readable.fromWeb(response.body),new Transform({transform(chunk,encoding,callback){size+=chunk.length;if(size>a.size)return callback(Error('Oversized asset'));hash.update(chunk);callback(null,chunk);}}),fs.createWriteStream(file,{flags:'wx'}));if(size!==a.size||hash.digest('hex')!==a.sha256)throw Error('Digest mismatch for '+a.name);}
              else {const data=Buffer.from(a.data,'base64');if(data.length!==a.size||crypto.createHash('sha256').update(data).digest('hex')!==a.sha256)throw Error('Content mismatch');fs.writeFileSync(file,data,{flag:'wx'});}
              console.log('Verified '+a.name);
            }));
            for(const a of manifest){const existing=release.assets.find(item=>item.name===a.name);if(existing){if(existing.size!==a.size||existing.digest!=='sha256:'+a.sha256)throw Error('Existing asset mismatch');continue;}cp.execFileSync('gh',['release','upload',tag,'installers/'+a.name,'--repo',repo],{stdio:'inherit'});}
            const uploaded=JSON.parse(cp.execFileSync('gh',['release','view',tag,'--repo',repo,'--json','assets,isDraft'],{encoding:'utf8'}));if(!uploaded.isDraft||uploaded.assets.length!==8)throw Error('Draft asset count mismatch');for(const a of manifest){const item=uploaded.assets.find(v=>v.name===a.name);if(!item||item.size!==a.size||item.digest!=='sha256:'+a.sha256)throw Error('Uploaded digest mismatch');}console.log('All eight draft assets verified. Publication remains manual.');
          }
          main().catch(error=>{console.error(String(error.message).replace(/https:\/\/\S+/g,'[URL]'));process.exitCode=1;});
          NODE
